name: GLOBUS V4 — qualité, sécurité, images, déploiement

on:
  push:
    branches: [main, develop]
    paths: ["projet2/systemcomplet/**", ".github/workflows/globus-v4.yml", ".gitleaks.toml"]
  pull_request:
    paths: ["projet2/systemcomplet/**", ".github/workflows/globus-v4.yml", ".gitleaks.toml"]

concurrency:
  group: globus-v4-${{ github.ref }}
  # Jamais d'annulation sur main : un déploiement en cours va toujours à son terme.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  ROOT: projet2/systemcomplet

jobs:
  api:
    name: API — lint, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: ${{ env.ROOT }}/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
      DATABASE_URL_ADMIN: postgresql+psycopg://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.ROOT }}/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Bandit (analyse statique sécurité)
        run: bandit -q -r app -ll
      - name: Migrations Alembic (base vide + synchronisation modèles)
        run: python scripts/check_migrations.py
      - name: Tests (PostgreSQL réel)
        run: pytest -q -p no:cacheprovider
      - name: Service de transcription (lint + tests, modèle simulé)
        working-directory: ${{ env.ROOT }}/services/stt
        run: |
          ruff check . && ruff format --check .
          python -m pytest -q -p no:cacheprovider
      - name: Formulaires web synchronisés avec l'OpenAPI
        run: |
          python scripts/export_openapi.py
          node ../apps/web/scripts/gen-schemas.mjs
          git diff --exit-code -- ../apps/web/src/generated/schemas.ts

  web:
    name: Web — types, lint, anti-mock, liens, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ROOT }}/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.ROOT }}/apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: V4-DEPLOY-42 — aucun mock en production (web + API)
        run: npm run check:mocks
      - name: Liens profonds → routes existantes (web + notifications API)
        run: npm run check:links
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.globus.invalid

  mobile:
    name: Mobile — analyse, tests, APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Libellés et charte synchronisés avec le web (source unique)
        working-directory: ${{ env.ROOT }}
        run: node packages/globus_core/tool/gen_shared.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Socle partagé (globus_core)
        working-directory: ${{ env.ROOT }}/packages/globus_core
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test
      - name: Application client — analyse et tests
        working-directory: ${{ env.ROOT }}/apps/mobile-client
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Application client — APK (production)
        working-directory: ${{ env.ROOT }}/apps/mobile-client
        run: flutter build apk --release --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: globus-client-apk-production
          path: ${{ env.ROOT }}/apps/mobile-client/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Application terrain — analyse et tests
        working-directory: ${{ env.ROOT }}/apps/mobile-field
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Application terrain — APK (production)
        working-directory: ${{ env.ROOT }}/apps/mobile-field
        run: flutter build apk --release --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: globus-terrain-apk-production
          path: ${{ env.ROOT }}/apps/mobile-field/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: Application direction — analyse et tests
        working-directory: ${{ env.ROOT }}/apps/mobile-direction
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test tool
          flutter analyze --fatal-infos
          flutter test
      - name: Application direction — APK (production)
        working-directory: ${{ env.ROOT }}/apps/mobile-direction
        run: flutter build apk --release --dart-define-from-file=config/production.json
      - uses: actions/upload-artifact@v4
        with:
          name: globus-direction-apk-production
          path: ${{ env.ROOT }}/apps/mobile-direction/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  mobile-ios:
    name: Mobile — compilation iOS (sans signature)
    runs-on: macos-latest
    if: github.event_name == 'push'
    needs: [mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Application client — iOS
        working-directory: ${{ env.ROOT }}/apps/mobile-client
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define-from-file=config/production.json
      - name: Application terrain — iOS
        working-directory: ${{ env.ROOT }}/apps/mobile-field
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define-from-file=config/production.json
      - name: Application direction — iOS
        working-directory: ${{ env.ROOT }}/apps/mobile-direction
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --dart-define-from-file=config/production.json

  security:
    name: Sécurité — secrets, dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets commités (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnérabilités Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r ${{ env.ROOT }}/backend/requirements.txt --strict
          pip-audit -r ${{ env.ROOT }}/services/stt/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vulnérabilités npm (production)
        working-directory: ${{ env.ROOT }}/apps/web
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images Docker (construction ; publication GHCR sur main)
    runs-on: ubuntu-latest
    needs: [api, web]
    permissions:
      contents: read
      packages: write
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Registre et étiquettes
        id: meta
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Connexion au registre GHCR
        if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image API + worker
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ROOT }}
          file: ${{ env.ROOT }}/infra/docker/api.Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: |
            ${{ steps.meta.outputs.registry }}/globus-api:${{ github.sha }}
            ${{ steps.meta.outputs.registry }}/globus-api:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ROOT }}
          file: ${{ env.ROOT }}/infra/docker/web.Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          # URL publique du site, figée dans l'image (variable du dépôt GLOBUS_SITE_URL).
          build-args: NEXT_PUBLIC_SITE_URL=${{ steps.meta.outputs.publish == 'true' && vars.GLOBUS_SITE_URL || 'https://ci.globus.invalid' }}
          tags: |
            ${{ steps.meta.outputs.registry }}/globus-web:${{ github.sha }}
            ${{ steps.meta.outputs.registry }}/globus-web:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Image transcription (Whisper)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ROOT }}
          file: ${{ env.ROOT }}/infra/docker/stt.Dockerfile
          push: ${{ steps.meta.outputs.publish == 'true' }}
          tags: |
            ${{ steps.meta.outputs.registry }}/globus-stt:${{ github.sha }}
            ${{ steps.meta.outputs.registry }}/globus-stt:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=stt
          cache-to: type=gha,mode=max,scope=stt
      - name: Configuration Compose valide
        working-directory: ${{ env.ROOT }}/infra
        run: |
          mkdir -p env
          printf 'GLOBUS_DOMAIN=ci.globus.invalid\nGLOBUS_WWW_DOMAIN=www.ci.globus.invalid\nACME_EMAIL=ops@globus.invalid\nTURN_PUBLIC_IP=203.0.113.10\n' > env/compose.env
          touch env/postgres.env env/api.env env/web.env env/turnserver.conf
          docker compose --env-file env/compose.env --profile tls --profile calls --profile antivirus --profile stt config --quiet
          bash -n scripts/deploy.sh scripts/ci-deploy.sh scripts/init-env.sh scripts/vps-bootstrap.sh scripts/set-secret.sh

  deploy:
    name: Déploiement production (VPS)
    runs-on: ubuntu-latest
    needs: [api, web, security, images]
    # Activé par la variable du dépôt GLOBUS_DEPLOY_ENABLED=true (serveur, clé SSH et domaine configurés).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GLOBUS_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.GLOBUS_SITE_URL }}
    concurrency:
      group: globus-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    steps:
      - name: Clé SSH et empreinte du serveur
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Mise en service du commit (commande imposée côté serveur)
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Coupure réseau passagère (code 255) : nouvel essai ; le déploiement côté serveur est idempotent et verrouillé.
        run: |
          for attempt in 1 2 3; do
            status=0
            printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 -o ServerAliveInterval=30 "deploy@${VPS_HOST}" "deploy ${GITHUB_SHA} ${GITHUB_ACTOR}" || status=$?
            [[ $status -ne 255 ]] && exit $status
            echo "Connexion SSH impossible (essai ${attempt}/3), nouvel essai dans 30 s"
            sleep 30
          done
          exit 255
      - name: Vérification publique (site, API, TLS)
        env:
          SITE: ${{ vars.GLOBUS_SITE_URL }}
        run: |
          for path in /health/live /api/v1/public/site /; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${SITE}${path}")"
            echo "${path} → ${code}"
            [[ "$code" == "200" ]] || exit 1
          done
      - name: Nettoyage de la clé
        if: always()
        run: rm -f ~/.ssh/deploy_key
