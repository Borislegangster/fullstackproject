name: GLOBUS V4 — qualité, sécurité, images

on:
  push:
    branches: [main, develop]
    paths: ["projet2/systemcomplet/**", ".github/workflows/globus-v4.yml", ".gitleaks.toml"]
  pull_request:
    paths: ["projet2/systemcomplet/**", ".github/workflows/globus-v4.yml", ".gitleaks.toml"]

concurrency:
  group: globus-v4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ROOT: projet2/systemcomplet

jobs:
  api:
    name: API — lint, migrations, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: ${{ env.ROOT }}/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
      DATABASE_URL_ADMIN: postgresql+psycopg://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.ROOT }}/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + format)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Bandit (analyse statique sécurité)
        run: bandit -q -r app -ll
      - name: Migrations Alembic (base vide + synchronisation modèles)
        run: python scripts/check_migrations.py
      - name: Tests (PostgreSQL réel)
        run: pytest -q -p no:cacheprovider
      - name: Formulaires web synchronisés avec l'OpenAPI
        run: |
          python scripts/export_openapi.py
          node ../apps/web/scripts/gen-schemas.mjs
          git diff --exit-code -- ../apps/web/src/generated/schemas.ts

  web:
    name: Web — types, lint, anti-mock, liens, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ROOT }}/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.ROOT }}/apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: V4-DEPLOY-42 — aucun mock en production (web + API)
        run: npm run check:mocks
      - name: Liens profonds → routes existantes (web + notifications API)
        run: npm run check:links
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ci.globus.invalid

  security:
    name: Sécurité — secrets, dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets commités (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnérabilités Python (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r ${{ env.ROOT }}/backend/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vulnérabilités npm (production)
        working-directory: ${{ env.ROOT }}/apps/web
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images Docker (construction)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image API + worker
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ROOT }}
          file: ${{ env.ROOT }}/infra/docker/api.Dockerfile
          push: false
          tags: globus/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ROOT }}
          file: ${{ env.ROOT }}/infra/docker/web.Dockerfile
          push: false
          build-args: NEXT_PUBLIC_SITE_URL=https://ci.globus.invalid
          tags: globus/web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Configuration Compose valide
        working-directory: ${{ env.ROOT }}/infra
        run: |
          mkdir -p env
          printf 'GLOBUS_DOMAIN=ci.globus.invalid\nGLOBUS_WWW_DOMAIN=www.ci.globus.invalid\nACME_EMAIL=ops@globus.invalid\nTURN_PUBLIC_IP=203.0.113.10\n' > env/compose.env
          touch env/postgres.env env/api.env env/web.env env/turnserver.conf
          docker compose --env-file env/compose.env --profile tls --profile calls --profile antivirus config --quiet
