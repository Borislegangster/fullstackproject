name: globus_core
description: "GLOBUS ENGINEERING — socle partagé des applications mobiles (charte, API, authentification, temps réel, appels, messagerie, notifications, compte)."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.2+hotfix.4
  flutter_widget_from_html_core: ^0.17.4
  go_router: ^18.1.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # Icône par défaut de la plateforme (remplacée à l'exécution par l'icône réglée dans le CMS : /public/brand).
    - assets/brand/icon.png
    - assets/brand/logo.png
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Light.ttf
          weight: 300
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: fonts/Gilroy-SemiBold.ttf
          weight: 600
        - asset: fonts/Gilroy-Bold.ttf
          weight: 700
    - family: Doxent
      fonts:
        - asset: fonts/Doxent-Regular.ttf
