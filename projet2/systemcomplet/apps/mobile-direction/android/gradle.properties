org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Réseaux instables (coupures DNS / TLS) : délais longs et nouvelles tentatives pour les téléchargements Gradle.
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.https.protocols=TLSv1.2
org.gradle.parallel=false
# Projet (G:) et cache pub (C:) sur des lecteurs différents : la compilation Kotlin incrémentale échoue sous Windows.
kotlin.incremental=false
