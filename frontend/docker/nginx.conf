server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable defaults — gzip + caching
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Long-lived cache for hashed bundles
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker MUST NOT be cached aggressively — workbox precaches new bundles
    location = /sw.js {
        add_header Cache-Control "no-cache, max-age=0";
        try_files $uri =404;
    }

    # SPA: any unknown path falls back to index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
